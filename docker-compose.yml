services:
  mysql:
    image: mysql:8.0
    container_name: inctrl-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${DB_NAME:-inctrl_db}
      MYSQL_USER: ${DB_USER_NON_ROOT:-inctrl_user}
      MYSQL_PASSWORD: ${DB_PASSWORD_NON_ROOT:-inctrl_password}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - inctrl_mysql_data:/var/lib/mysql
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-rootpassword}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  inctrl_mysql_data:
